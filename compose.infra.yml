services:
  postgres:
    image: pgvector/pgvector:pg16
    # CDC reads job_search_outbox (search sync) and graph_sync_outbox (recommendation) through logical replication
    # slots, one per consumer.
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      # A consumer that stays down makes its slot keep WAL forever and fill the disk. Past this limit the slot is
      # invalidated instead and that consumer has to sync from scratch (README, "Slot bị mất").
      - -c
      - max_slot_wal_keep_size=${POSTGRES_MAX_SLOT_WAL:-4GB}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JOB_PLATFORM_DB: ${JOB_PLATFORM_DB:-job_platform}
      JOB_CRAWLER_DB: ${JOB_CRAWLER_DB:-job_crawler}
      RECOMMENDATION_DB: ${RECOMMENDATION_DB:-jobbeacon_recommendation}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - jobbeacon

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - jobbeacon

  redis:
    image: redis/redis-stack-server:latest
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      # redis-stack-server writes to /var/lib/redis-stack unless told otherwise, so without --dir nothing reaches the
      # volume and recreating the container loses the crawler's Bloom filter and URL queue.
      REDIS_ARGS: "--appendonly yes --dir /data"
      BLOOM_FILTER_NAME: ${BLOOM_FILTER_NAME:-crawler:urls}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./redis/init-bloom.sh:/init-bloom.sh:ro
    entrypoint: ["/bin/sh", "/init-bloom.sh"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - jobbeacon

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      ES_JAVA_OPTS: "-Xms${ELASTICSEARCH_HEAP:-512m} -Xmx${ELASTICSEARCH_HEAP:-512m}"
      cluster.name: jobbeacon
    ports:
      - "127.0.0.1:${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped
    networks:
      - jobbeacon

  neo4j:
    image: neo4j:5.26
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-change_this_password}
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: gds.*
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-1G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-512M}
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/7687'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped
    networks:
      - jobbeacon

networks:
  jobbeacon:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  elasticsearch_data:
  neo4j_data:
  neo4j_plugins:
