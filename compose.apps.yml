services:
  discovery:
    image: ${DISCOVERY_IMAGE:-jobbeacon/discovery:latest}
    build:
      context: ../Jobbeacon-discovery
      dockerfile: Dockerfile
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      PORT: 8761
      EUREKA_HOSTNAME: discovery
      LOKI_URL: ${LOKI_URL:-http://loki:3100/loki/api/v1/push}
      TZ: Asia/Ho_Chi_Minh
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Ho_Chi_Minh ${DISCOVERY_JAVA_OPTS:-}"
    ports:
      - "127.0.0.1:${DISCOVERY_PORT:-8761}:8761"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8761'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - jobbeacon

  backend:
    image: ${BACKEND_IMAGE:-jobbeacon/backend:latest}
    build:
      context: ../Jobbeacon-be
      dockerfile: Dockerfile
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      PROFILE_ACTIVE: ${PROFILE_ACTIVE:-prod}
      PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${JOB_PLATFORM_DB:-job_platform}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASS:-guest}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      ELASTICSEARCH_JOB_INDEX: ${ELASTICSEARCH_JOB_INDEX:-jobs}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}
      GEMINI_EMBEDDING_DIMENSION: ${GEMINI_EMBEDDING_DIMENSION:-1536}
      GEMINI_CHAT_MODELS: ${GEMINI_CHAT_MODELS:-gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemma-4-26b-a4b-it,gemma-4-31b-it}
      SEARCH_BACKFILL_ON_STARTUP: ${SEARCH_BACKFILL_ON_STARTUP:-false}
      CATEGORY_CLASSIFICATION_MIN_SCORE: ${CATEGORY_CLASSIFICATION_MIN_SCORE:-0.72}
      CATEGORY_CLASSIFICATION_MIN_MARGIN: ${CATEGORY_CLASSIFICATION_MIN_MARGIN:-0.03}
      LOKI_URL: ${LOKI_URL:-http://loki:3100/loki/api/v1/push}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-change_this_internal_token}
      EUREKA_URL: ${EUREKA_URL:-http://discovery:8761/eureka/}
      TZ: Asia/Ho_Chi_Minh
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Ho_Chi_Minh ${BACKEND_JAVA_OPTS:-}"
      # Loaded into the category table on startup until every category has an embedding; missing file = skipped.
      CATEGORY_EMBEDDINGS_FILE: /data/category_embeddings.json
    # data/category_embeddings.json is not in git (~50MB): download it, see data/README.md.
    volumes:
      - ./data:/data:ro
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      discovery:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - jobbeacon

  gateway:
    image: ${GATEWAY_IMAGE:-jobbeacon/gateway:latest}
    build:
      context: ../Jobbeacon-gateway
      dockerfile: Dockerfile
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      PROFILE_ACTIVE: ${PROFILE_ACTIVE:-prod}
      SERVER_PORT: 8088
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?FIREBASE_PROJECT_ID is required}
      # Routes resolve the backend and recommendation by their Eureka names (lb://...), not by URL.
      EUREKA_URL: ${EUREKA_URL:-http://discovery:8761/eureka/}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LOKI_URL: ${LOKI_URL:-http://loki:3100/loki/api/v1/push}
      TZ: Asia/Ho_Chi_Minh
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Ho_Chi_Minh ${GATEWAY_JAVA_OPTS:-}"
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8088}:8088"
    depends_on:
      discovery:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - jobbeacon

  crawler:
    image: ${CRAWLER_IMAGE:-jobbeacon/crawler:latest}
    build:
      context: ../job-posting-crawler
      dockerfile: Dockerfile
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      PROFILE_ACTIVE: ${PROFILE_ACTIVE:-prod}
      PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/${JOB_CRAWLER_DB:-job_crawler}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      LIQUIBASE_ENABLED: ${CRAWLER_LIQUIBASE_ENABLED:-true}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASS:-guest}
      JOB_URL_BLOOM_FILTER_NAME: ${BLOOM_FILTER_NAME:-crawler:urls}
      PLAYWRIGHT_HEADLESS: ${PLAYWRIGHT_HEADLESS:-true}
      PLAYWRIGHT_PROXIES: ${PLAYWRIGHT_PROXIES:-}
      CRAWLER_WORKER_POOL_SIZE: ${CRAWLER_WORKER_POOL_SIZE:-1}
      CRAWLER_MAX_DEPTH: ${CRAWLER_MAX_DEPTH:-5}
      # LLM discovery of the HTML XPaths for domains without configuration (table domain_extractor_config)
      STRUCTURE_DISCOVERY_ENABLED: ${CRAWLER_STRUCTURE_DISCOVERY_ENABLED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LOKI_URL: ${LOKI_URL:-http://loki:3100/loki/api/v1/push}
      EUREKA_URL: ${EUREKA_URL:-http://discovery:8761/eureka/}
      TZ: Asia/Ho_Chi_Minh
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Ho_Chi_Minh ${CRAWLER_JAVA_OPTS:-}"
    ports:
      - "127.0.0.1:${CRAWLER_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      discovery:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8081'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - jobbeacon

  sync:
    image: ${SYNC_IMAGE:-jobbeacon/sync:latest}
    build:
      context: ../Jobbeacon-sync
      dockerfile: Dockerfile
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      PROFILE_ACTIVE: ${PROFILE_ACTIVE:-prod}
      PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/${JOB_PLATFORM_DB:-job_platform}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      ELASTICSEARCH_JOB_INDEX: ${ELASTICSEARCH_JOB_INDEX:-jobs}
      SYNC_MODE: ${SYNC_MODE:-stream}
      SYNC_SLOT_NAME: ${SYNC_SLOT_NAME:-jobbeacon_search}
      SYNC_PUBLICATION_NAME: ${SYNC_PUBLICATION_NAME:-jobbeacon_search}
      EUREKA_URL: ${EUREKA_URL:-http://discovery:8761/eureka/}
      LOKI_URL: ${LOKI_URL:-http://loki:3100/loki/api/v1/push}
      TZ: Asia/Ho_Chi_Minh
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Ho_Chi_Minh ${SYNC_JAVA_OPTS:-}"
    ports:
      - "127.0.0.1:${SYNC_PORT:-8082}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      discovery:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8081'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped
    networks:
      - jobbeacon

  recommendation:
    image: ${RECOMMENDATION_IMAGE:-jobbeacon/recommendation:latest}
    build:
      context: ../jobbeacon-recommendation
      dockerfile: Dockerfile
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      PROFILE_ACTIVE: ${PROFILE_ACTIVE:-prod}
      PORT: 8083
      DB_URL: jdbc:postgresql://postgres:5432/${RECOMMENDATION_DB:-jobbeacon_recommendation}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      BACKEND_DB_URL: jdbc:postgresql://postgres:5432/${JOB_PLATFORM_DB:-job_platform}
      BACKEND_DB_USERNAME: ${POSTGRES_USER:-postgres}
      BACKEND_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      GRAPH_CDC_SLOT_NAME: ${GRAPH_CDC_SLOT_NAME:-jobbeacon_graph}
      GRAPH_CDC_PUBLICATION_NAME: ${GRAPH_CDC_PUBLICATION_NAME:-jobbeacon_graph}
      # Feign calls the backend by its Eureka name, not by URL.
      BACKEND_SERVICE_ID: ${BACKEND_SERVICE_ID:-jobbeacon-be}
      EUREKA_URL: ${EUREKA_URL:-http://discovery:8761/eureka/}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-change_this_password}
      GRAPH_REFRESH_INTERVAL: ${GRAPH_REFRESH_INTERVAL:-PT15M}
      GRAPH_INTERACTION_WINDOW: ${GRAPH_INTERACTION_WINDOW:-P180D}
      GRAPH_BACKFILL_ON_STARTUP: ${GRAPH_BACKFILL_ON_STARTUP:-true}
      RECOMMENDATION_POOL_SIZE: ${RECOMMENDATION_POOL_SIZE:-100}
      RECOMMENDATION_SAMPLING_TEMPERATURE: ${RECOMMENDATION_SAMPLING_TEMPERATURE:-0.5}
      RECOMMENDATION_APPLIED_HIDDEN_FOR: ${RECOMMENDATION_APPLIED_HIDDEN_FOR:-P14D}
      LOKI_URL: ${LOKI_URL:-http://loki:3100/loki/api/v1/push}
      TZ: Asia/Ho_Chi_Minh
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Ho_Chi_Minh ${RECOMMENDATION_JAVA_OPTS:-}"
    ports:
      - "127.0.0.1:${RECOMMENDATION_PORT:-8083}:8083"
    depends_on:
      postgres:
        condition: service_healthy
      # Started, not healthy: the backend and Neo4j being down only delays graph syncs, which retry on their own.
      backend:
        condition: service_started
      neo4j:
        condition: service_started
      discovery:
        condition: service_healthy
    healthcheck:
      # Asks the service rather than just the port: it answers 503 when changes from the backend stop arriving.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8083
          && printf 'GET /jobbeacon-recommendation/api/v1/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          && head -n 1 <&3 | grep -q ' 200'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped
    networks:
      - jobbeacon

  frontend:
    image: ${FRONTEND_IMAGE:-jobbeacon/frontend:latest}
    build:
      context: ../Jobbeacon-fe
      dockerfile: Dockerfile
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8088}
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-your_api_key}
      VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-your-project.firebaseapp.com}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-your_project_id}
      VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-your-project.firebasestorage.app}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-your_sender_id}
      VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-your_app_id}
      # Admin only: "view on site" links and the embedded Grafana dashboards page. Empty hides each.
      VITE_USER_SITE_URL: ${VITE_USER_SITE_URL:-}
      VITE_GRAFANA_URL: ${VITE_GRAFANA_URL:-}
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-3000}:80"
      - "${FRONTEND_ADMIN_BIND:-127.0.0.1}:${FRONTEND_ADMIN_PORT:-3002}:8080"
    depends_on:
      gateway:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - jobbeacon
