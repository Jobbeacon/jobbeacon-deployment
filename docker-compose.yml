name: jobbeacon

services:
  postgres:
    image: pgvector/pgvector:pg16
    # CDC reads job_search_outbox through a logical replication slot.
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JOB_PLATFORM_DB: ${JOB_PLATFORM_DB:-job_platform}
      JOB_CRAWLER_DB: ${JOB_CRAWLER_DB:-job_crawler}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - jobbeacon

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - jobbeacon

  redis:
    image: redis/redis-stack-server:latest
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      REDIS_ARGS: "--appendonly yes"
      BLOOM_FILTER_NAME: ${BLOOM_FILTER_NAME:-crawler:urls}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./redis/init-bloom.sh:/init-bloom.sh:ro
    entrypoint: ["/bin/sh", "/init-bloom.sh"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - jobbeacon

  backend:
    image: ${BACKEND_IMAGE:-jobbeacon/backend:latest}
    build:
      context: ../Jobbeacon-be
      dockerfile: Dockerfile
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      PROFILE_ACTIVE: ${PROFILE_ACTIVE:-prod}
      PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${JOB_PLATFORM_DB:-job_platform}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASS:-guest}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      ELASTICSEARCH_JOB_INDEX: ${ELASTICSEARCH_JOB_INDEX:-jobs}
      FIREBASE_CREDENTIALS_PATH: /run/secrets/firebase-service-account.json
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}
      GEMINI_EMBEDDING_DIMENSION: ${GEMINI_EMBEDDING_DIMENSION:-1536}
      CATEGORY_CLASSIFICATION_MIN_SCORE: ${CATEGORY_CLASSIFICATION_MIN_SCORE:-0.72}
      CATEGORY_CLASSIFICATION_MIN_MARGIN: ${CATEGORY_CLASSIFICATION_MIN_MARGIN:-0.03}
      LOKI_URL: ${LOKI_URL:-http://loki:3100/loki/api/v1/push}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-change_this_password}
      GRAPH_ENABLED: ${GRAPH_ENABLED:-true}
      GRAPH_POLL_INTERVAL: ${GRAPH_POLL_INTERVAL:-PT5S}
      GRAPH_BACKFILL_ON_STARTUP: ${GRAPH_BACKFILL_ON_STARTUP:-false}
      TZ: Asia/Ho_Chi_Minh
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Ho_Chi_Minh"
    volumes:
      - type: bind
        source: ${FIREBASE_CREDENTIALS_FILE:-./firebase-service-account.json}
        target: /run/secrets/firebase-service-account.json
        read_only: true
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Started, not healthy: graph sync retries on its own, and the API must not wait on Neo4j.
      neo4j:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - jobbeacon

  crawler:
    image: ${CRAWLER_IMAGE:-jobbeacon/crawler:latest}
    build:
      context: ../job-posting-crawler
      dockerfile: Dockerfile
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      PROFILE_ACTIVE: ${PROFILE_ACTIVE:-prod}
      PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/${JOB_CRAWLER_DB:-job_crawler}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      LIQUIBASE_ENABLED: ${CRAWLER_LIQUIBASE_ENABLED:-true}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASS:-guest}
      JOB_URL_BLOOM_FILTER_NAME: ${BLOOM_FILTER_NAME:-crawler:urls}
      PLAYWRIGHT_HEADLESS: ${PLAYWRIGHT_HEADLESS:-true}
      PLAYWRIGHT_PROXIES: ${PLAYWRIGHT_PROXIES:-}
      CRAWLER_WORKER_POOL_SIZE: ${CRAWLER_WORKER_POOL_SIZE:-1}
      CRAWLER_MAX_DEPTH: ${CRAWLER_MAX_DEPTH:-5}
      LOKI_URL: ${LOKI_URL:-http://loki:3100/loki/api/v1/push}
      TZ: Asia/Ho_Chi_Minh
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Ho_Chi_Minh"
    ports:
      - "${CRAWLER_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8081'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - jobbeacon

  neo4j:
    image: neo4j:5.26
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-change_this_password}
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: gds.*
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-1G}
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/7687'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped
    networks:
      - jobbeacon

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      cluster.name: jobbeacon
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped
    networks:
      - jobbeacon

  sync:
    image: ${SYNC_IMAGE:-jobbeacon/sync:latest}
    build:
      context: ../Jobbeacon-sync
      dockerfile: Dockerfile
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      PROFILE_ACTIVE: ${PROFILE_ACTIVE:-prod}
      PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/${JOB_PLATFORM_DB:-job_platform}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      ELASTICSEARCH_JOB_INDEX: ${ELASTICSEARCH_JOB_INDEX:-jobs}
      SYNC_MODE: ${SYNC_MODE:-stream}
      SYNC_SLOT_NAME: ${SYNC_SLOT_NAME:-jobbeacon_search}
      SYNC_PUBLICATION_NAME: ${SYNC_PUBLICATION_NAME:-jobbeacon_search}
      TZ: Asia/Ho_Chi_Minh
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Ho_Chi_Minh"
    ports:
      - "${SYNC_PORT:-8082}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8081'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped
    networks:
      - jobbeacon

  frontend:
    image: ${FRONTEND_IMAGE:-jobbeacon/frontend:latest}
    build:
      context: ../Jobbeacon-fe
      dockerfile: Dockerfile
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-your_api_key}
      VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-your-project.firebaseapp.com}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-your_project_id}
      VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-your-project.firebasestorage.app}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-your_sender_id}
      VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-your_app_id}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - jobbeacon

  loki:
    image: grafana/loki:3.5.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    container_name: jobbeacon-loki
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - jobbeacon

  prometheus:
    image: prom/prometheus:latest
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    container_name: jobbeacon-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      crawler:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - jobbeacon

  grafana:
    image: grafana/grafana:12.0.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    container_name: jobbeacon-grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - jobbeacon

networks:
  jobbeacon:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  elasticsearch_data:
  neo4j_data:
  neo4j_plugins:
  loki_data:
  grafana_data:
  prometheus_data:
