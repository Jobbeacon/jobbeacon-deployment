name: jobbeacon

services:
  postgres:
    image: postgres:16-alpine
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JOB_PLATFORM_DB: ${JOB_PLATFORM_DB:-job_platform}
      JOB_CRAWLER_DB: ${JOB_CRAWLER_DB:-job_crawler}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - jobbeacon

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - jobbeacon

  redis:
    image: redis/redis-stack-server:latest
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      REDIS_ARGS: "--appendonly yes"
      BLOOM_FILTER_NAME: ${BLOOM_FILTER_NAME:-crawler:urls}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./redis/init-bloom.sh:/init-bloom.sh:ro
    entrypoint: ["/bin/sh", "/init-bloom.sh"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - jobbeacon

  backend:
    image: ${BACKEND_IMAGE:-jobbeacon/backend:latest}
    build:
      context: ../Jobbeacon-be
      dockerfile: Dockerfile
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      PROFILE_ACTIVE: ${PROFILE_ACTIVE:-prod}
      PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-job_platform}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASS:-guest}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      FIREBASE_CREDENTIALS_PATH: /run/secrets/firebase-service-account.json
      LOKI_URL: ${LOKI_URL:-http://loki:3100/loki/api/v1/push}
      TZ: Asia/Ho_Chi_Minh
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Ho_Chi_Minh"   
    volumes:
      - type: bind
        source: ${FIREBASE_CREDENTIALS_FILE:-./firebase-service-account.json}
        target: /run/secrets/firebase-service-account.json
        read_only: true
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - jobbeacon

  frontend:
    image: ${FRONTEND_IMAGE:-jobbeacon/frontend:latest}
    build:
      context: ../Jobbeacon-fe
      dockerfile: Dockerfile
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-your_api_key}
      VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-your-project.firebaseapp.com}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-your_project_id}
      VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-your-project.firebasestorage.app}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-your_sender_id}
      VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-your_app_id}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - jobbeacon

  loki:
    image: grafana/loki:3.5.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    container_name: jobbeacon-loki
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - jobbeacon

  grafana:
    image: grafana/grafana:12.0.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    container_name: jobbeacon-grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - jobbeacon

networks:
  jobbeacon:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  loki_data:
  grafana_data:
