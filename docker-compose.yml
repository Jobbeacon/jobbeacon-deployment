# Entry point for the whole stack, locally and on the VM. Each file can be edited on its own:
#   compose.infra.yml          Postgres, RabbitMQ, Redis, Elasticsearch, Neo4j (stateful, rarely restarted)
#   compose.apps.yml           discovery and the application services (redeployed by CI)
#   compose.observability.yml  Loki, Prometheus, Grafana
# They are one Compose project, so depends_on and the jobbeacon network work across files.
# Every published port binds to 127.0.0.1 except the frontend (FRONTEND_BIND); reach the rest through an SSH tunnel.
name: jobbeacon

include:
  - compose.infra.yml
  - compose.apps.yml
  - compose.observability.yml
