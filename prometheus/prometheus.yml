global:
  scrape_interval: 15s

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["host.docker.internal:9100"]

  - job_name: crawler
    metrics_path: /job-posting-crawler/actuator/prometheus
    static_configs:
      - targets: ["crawler:8081"]

  - job_name: backend
    metrics_path: /jobbeacon-be/actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]

  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway:8088"]

  - job_name: discovery
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["discovery:8761"]

  - job_name: recommendation
    metrics_path: /jobbeacon-recommendation/actuator/prometheus
    static_configs:
      - targets: ["recommendation:8083"]

  - job_name: sync
    metrics_path: /jobbeacon-sync/actuator/prometheus
    static_configs:
      - targets: ["sync:8081"]
