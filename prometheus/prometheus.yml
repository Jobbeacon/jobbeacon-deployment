global:
  scrape_interval: 15s

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["host.docker.internal:9100"]

  - job_name: crawler
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["crawler:8081"]

  # backend, gateway, discovery, recommendation and sync aren't containerized in this compose file yet
  # (run locally via mvn spring-boot:run), so Prometheus reaches them on the host instead of by service name.
  - job_name: backend
    metrics_path: /jobbeacon-be/actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]

  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8088"]

  - job_name: discovery
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8761"]

  - job_name: recommendation
    metrics_path: /jobbeacon-recommendation/actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8083"]

  - job_name: sync
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]
